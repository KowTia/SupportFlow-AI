[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supportflow-ai"
version = "0.1.0"
description = "AI-powered support ticket ingestion, RAG analysis, validation, and routing platform."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kowtia", email = "egorbel3@gmail.com" }]
requires-python = ">=3.12"
keywords = ["fastapi", "rag", "pgvector", "llm", "celery", "support-automation", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.5",
    "celery>=5.4.0",
    "packaging>=24.0",
    "redis>=5.1.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/KowTia/SupportFlow-AI"
Repository = "https://github.com/KowTia/SupportFlow-AI"
Issues = "https://github.com/KowTia/SupportFlow-AI/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
