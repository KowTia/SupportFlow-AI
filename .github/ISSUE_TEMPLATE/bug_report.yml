name: Bug Report
description: Report a reproducible bug or unexpected behavior in SupportFlow AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, API requests, or UI steps to reproduce the issue.
      placeholder: |
        1. Start stack with `docker compose up -d`
        2. Send POST `/api/v1/tickets`
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, Docker vs local, LLM provider (`mock`, `openai`, `ollama`).
      placeholder: "e.g. Windows 11 / Ubuntu 24.04, Python 3.12, Docker Compose, LLM_PROVIDER=mock"
